<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#060b14">
<meta name="description" content="Legend Rising: an NSS-style football career game. Start in Romanian Liga 4 and make it to the Ballon d'Or.">
<title>Legend Rising</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2026.10.05b">
</head>
<body>
<!-- the stadium backdrop lives outside #app so re-drawing a screen never restarts it -->
<div id="bg" class="title-bg"><div class="beam b1"></div><div class="beam b2"></div><div class="pitchlines"></div></div>
<!-- the first-person world: everything here is test-build only -->
<div id="lifeRoot" style="display:none">
  <canvas id="lifeCanvas"></canvas>
  <div class="hud-tl"><div class="hud-clock"><b id="lifeClock">7:00 AM</b><span id="lifeDay">Monday</span></div><div id="lifeCtx" class="hud-ctx"></div></div>
  <div class="hud-tr">
    <div id="lifeMoney" class="hud-money">€0</div>
    <div class="hud-needs">
      <div class="need en" title="Energy — food keeps it up"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.4 1 3 9h4.2L6.4 15 13 6.8H8.7z"/></svg><div class="nb"><i id="lifeEnergy"></i></div></div>
      <div class="need fa" title="Fatigue — sleep and rest bring it down"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 1.4A6.6 6.6 0 1 0 14.6 11 5.4 5.4 0 0 1 10.6 1.4z"/></svg><div class="nb"><i id="lifeFatigue"></i></div></div>
    </div>
    <div id="lifeMoneyChips" class="hud-mchips"></div>
  </div>
  <div class="lf-cross"></div>
  <div id="lifePrompt" class="lf-prompt"><kbd class="lp-key">E</kbd><div class="lp-txt"><span class="lp-label"></span><span class="lp-hint"></span></div></div>
  <div id="lifeMatch" class="lf-match"><b></b><span></span><div class="lf-mbar"><i></i></div></div>
  <div id="lifeCenter" class="lf-center"></div>
  <div id="lifeFeed" class="lf-feed"></div>
  <div id="lifeNote" class="lf-note"></div>
  <div id="lifeBusy" class="lf-busy"></div>
  <div id="lifeDrill" class="lf-drill"></div>
  <div class="lf-keys" id="lifeKeys"><span><kbd>W A S D</kbd> move</span><span><kbd>Shift</kbd> run · hold to sprint</span><span><kbd>E</kbd> use</span><span><kbd>V</kbd> 1st / 3rd person</span><span><kbd>Tab</kbd> phone</span><span><kbd>Q</kbd> hub</span><span><kbd>H</kbd> hide</span></div>
  <div class="lf-hand" id="lifeHandHint"></div>
  <div id="lifePanel" class="lf-panel"></div>
</div>
<div id="lifeDim"></div>
<div id="lifePhone"><div class="lp-screen"><div id="app"></div></div><div class="lp-frame"></div></div>
<div id="lifeFade"></div>
<script>window.FF_BUILD = "2026.10.05b";</script>
<!-- the 3D world is ES modules that import each other by plain relative paths: this map gives every one of those
     imports this build's version, so a returning player never runs a fresh world.js against a cached build.js.
     Bump it together with FF_BUILD and every ?v= below. -->
<script type="importmap">
{
  "imports": {
    "./js/life/build.js": "./js/life/build.js?v=2026.10.05b",
    "./js/life/drills.js": "./js/life/drills.js?v=2026.10.05b",
    "./js/life/fridge.js": "./js/life/fridge.js?v=2026.10.05b",
    "./js/life/ground.js": "./js/life/ground.js?v=2026.10.05b",
    "./js/life/home.js": "./js/life/home.js?v=2026.10.05b",
    "./js/life/human.js": "./js/life/human.js?v=2026.10.05b",
    "./js/life/look.js": "./js/life/look.js?v=2026.10.05b",
    "./js/life/npc.js": "./js/life/npc.js?v=2026.10.05b",
    "./js/life/phone.js": "./js/life/phone.js?v=2026.10.05b",
    "./js/life/props.js": "./js/life/props.js?v=2026.10.05b",
    "./js/life/rent.js": "./js/life/rent.js?v=2026.10.05b",
    "./js/life/shops.js": "./js/life/shops.js?v=2026.10.05b",
    "./js/life/sky.js": "./js/life/sky.js?v=2026.10.05b",
    "./js/life/world.js": "./js/life/world.js?v=2026.10.05b",
    "./vendor/three.module.js": "./vendor/three.module.js?v=2026.10.05b",
    "./vendor/three.core.js": "./vendor/three.core.js?v=2026.10.05b"
  }
}
</script>
<div id="sheetRoot"></div>
<div id="phoneRoot" class="hidden"></div>
<div id="tutRoot" class="tut"></div>
<!-- Plain scripts (not modules) so the game also runs by double-clicking index.html. Order matters. -->

</body>
</html>
