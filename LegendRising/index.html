<meta name="description" content="Legend Rising: an NSS-style football career game. Start in Romanian Liga 4 and make it to the Ballon d'Or.">

<body>
<!-- the stadium backdrop lives outside #app so re-drawing a screen never restarts it -->
<div id="bg" class="title-bg"><div class="beam b1"></div><div class="beam b2"></div><div class="pitchlines"></div></div>
<!-- the first-person world: everything here is test-build only -->
<div id="lifeRoot" style="display:none">
  <canvas id="lifeCanvas"></canvas>
  <div id="lifeCompass" class="lf-compass" aria-hidden="true"><div class="cp-dial"><div class="cp-strip"></div></div><i class="cp-needle"></i><div class="cp-marks"></div></div>
  <div class="hud-tl"><div class="hud-clock"><b id="lifeClock">7:00 AM</b><span id="lifeDay">Monday</span></div><div id="lifeCtx" class="hud-ctx"></div></div>
  <div class="hud-tr">
    <div id="lifeMoney" class="hud-money">€0</div>
    <div class="hud-needs">
      <div class="need en" title="Energy: food keeps it up"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.4 1 3 9h4.2L6.4 15 13 6.8H8.7z"/></svg><span>Energy</span><div class="nb"><i id="lifeEnergy"></i></div><b></b><em></em></div>
      <div class="need hy" title="Hydration: drinks keep it up"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2C6.2 4 3.6 6.8 3.6 9.8a4.4 4.4 0 0 0 8.8 0C12.4 6.8 9.8 4 8 1.2z"/></svg><span>Hydration</span><div class="nb"><i id="lifeHyd"></i></div><b></b><em></em></div>
      <div class="need fa" title="Fatigue: sleep and rest bring it down"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.6 1.4A6.6 6.6 0 1 0 14.6 11 5.4 5.4 0 0 1 10.6 1.4z"/></svg><span>Fatigue</span><div class="nb"><i id="lifeFatigue"></i></div><b></b><em></em></div>
      <div class="need hg" title="Hygiene: a shower or a bath keeps you fresh"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 9h10v1.2a4.5 4.5 0 0 1-4.5 4.5h-1A4.5 4.5 0 0 1 3 10.2zM5 2.2a2 2 0 0 1 3.4 1.4V8H7.2V3.6a.8.8 0 0 0-1.4-.5z"/></svg><span>Hygiene</span><div class="nb"><i id="lifeHyg"></i></div><b></b><em></em></div>
    </div>
    <div id="lifeMoneyChips" class="hud-mchips"></div>
  </div>
  <div class="lf-cross"></div>
  <div id="lifePrompt" class="lf-prompt"><kbd class="lp-key">E</kbd><div class="lp-txt"><span class="lp-label"></span><span class="lp-hint"></span><div class="lp-lines"></div></div></div>
  <div id="lifeMatch" class="lf-match"><b></b><span></span><div class="lf-mbar"><i></i></div></div>
  <div id="lifeCenter" class="lf-center"></div>
  <div id="lifeFeed" class="lf-feed"></div>
  <div id="lifeNote" class="lf-note"></div>
  <div id="lifeBusy" class="lf-busy"></div>
  <div id="lifeDrill" class="lf-drill"></div>
  <div class="lf-keys" id="lifeKeys"><span><kbd>W A S D</kbd> move</span><span><kbd>Shift</kbd> run · hold to sprint</span><span><kbd>E</kbd> use</span><span><kbd>LMB</kbd> pick up</span><span><kbd>1</kbd><kbd>2</kbd> pockets · <kbd>G</kbd> drop</span><span><kbd>V</kbd> 1st / 3rd person</span><span><kbd>Tab</kbd> phone</span><span><kbd>Q</kbd> hub</span><span><kbd>H</kbd> hide</span></div>
  <div class="lf-hand" id="lifeHandHint"></div>
  <div id="lifeInv" class="lf-inv"></div>
  <div id="lifePanel" class="lf-panel"></div>
</div>
<div id="lifeDim"></div>
<div id="lifePhone"><div class="lp-screen"><div id="app"></div></div><div class="lp-frame"></div></div>
<div id="lifeFade"></div>
<script>window.FF_BUILD = "2026.10.05d";</script>
